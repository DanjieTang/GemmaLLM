[project]
name = "gemma-llm"
version = "0.1.0"
description = "A PyTorch language and vision-language model implementation"
requires-python = ">=3.12"
dependencies = [
    "torch==2.10.0",
    "transformers==5.2.0",
    "datasets",
    "matplotlib",
    "tqdm",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
wandb = ["wandb"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

# Preserve the CUDA 13.0 PyTorch build used by the existing Linux environment.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
